<!DOCTYPE html>


<html>
    <head>
        <meta charset='utf-8' content='user-scalable=no, width=720' name='viewport'>
        <title>Test</title>

        <link href='/Packages/Generic/Frontend/Themes/Main/Main.css' rel='stylesheet'>

        <style>
            body {
                --size: 100px;

                user-select: none;
            }

            x-draggable {
                --Component_displayInner: grid;
                --Draggable_dropAreas: url('#{x-draggable}');
                --GestureArea_deferredMagnetism: true;
                --GestureArea_dynamicEnvironment: true;
                /* --GestureArea_magnetAreas: url('#{x-draggable}'); */
                --GestureArea_magnetAreas: url('#{x-resizable:not(:active)}');
                --GestureArea_magnetism: 10;
                /* --GestureArea_receptive: true; */

                /* box-sizing: border-box; */
                /* background: #0f02; */
                height: var(--size);
                left: calc(var(--index) * var(--size));
                max-height: 256px;
                max-width: 256px;
                /* margin: 2px; */
                min-height: 64px;
                min-width: 64px;
                position: absolute;
                top: calc(var(--index) * var(--size));
                width: var(--size);
            }

            x-repeater {
                --Component_autoRefresh: true;
            }

            x-resizable {
                --Component_eventsWithoutPropagation: swipeMain swipeStartMain swipeStopMain;
                /* --Component_eventsWithoutPropagation: pointerdown swipeMain; */
                --GestureArea_deferredMagnetism: true;
                --GestureArea_dynamicEnvironment: true;
                /* --GestureArea_magnetAreas: url('#{x-draggable}'); */
                --GestureArea_magnetAreas: url('#{x-resizable:not(:active)}');
                /* --GestureArea_magnetAreas: url('#{x-resizable}'); */
                --GestureArea_magnetism: 10;
                /* --Resizable_fixed: true; */
                /* --Resizable_keepProportions: true; */
                --Resizable_resettable: true;
                --Resizable_target: url('#{x-draggable}');


                background: #0f04;
                border: #000 solid 1px;
                /* background: #0f04; */
                /* min-height: auto; */
                /* min-width: auto; */


                &[_resizing] {
                    background: #00f4;
                }

                [_dragging] & {
                    background: #f004;
                }


                &::part(display) {
                    display: grid;
                    place-items: center;
                }
            }


            [_Draggable_dropAreaTarget] {
                /* border-color: #f00; */
            }

            [_GestureArea_magnetAreaActive] {
                background: #f004;
            }

            [_GestureArea_magnetAreaActiveBottom] {
                border-bottom: red solid 2px;
                /* border-bottom-color: red; */
            }

            [_GestureArea_magnetAreaActiveLeft] {
                border-left: red solid 2px;
                /* border-left-color: red; */
            }

            [_GestureArea_magnetAreaActiveRight] {
                border-right: red solid 2px;
                /* border-right-color: red; */
            }

            [_GestureArea_magnetAreaActiveTop] {
                border-top: red solid 2px;
                /* border-top-color: red; */
            }
        </style>

        <script type='module'>
            import * as generic from '/Packages/Generic/Generic.js';


            let Component = generic.frontend.components.Component;
            await Component._defined;
        </script>
    </head>

    <body>
        <x-repeater interpolationKey='repeater' model='1e2'>
            <template Repeater_delegate>
                <x-draggable style='--index: {{repeater: index}};'>
                    <x-resizable>
                        {{repeater: data.value}}
                    </x-resizable>
                </x-draggable>
            </template>
        </x-repeater>
    </body>
</html>
