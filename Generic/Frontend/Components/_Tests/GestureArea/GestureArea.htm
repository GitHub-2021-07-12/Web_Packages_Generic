<!DOCTYPE html>


<html>
    <head>
        <meta charset='utf-8' content='user-scalable=no, width=720' name='viewport'>
        <title>Test</title>

        <link href='/Packages/Generic/Frontend/Themes/Main/Main.css' rel='stylesheet'>

        <style>
            body {
                --size: 100px;

                user-select: none;
            }

            x-draggable {
                --Component_displayInner: grid;
                --Draggable_dropAreas: url('#{x-resizable:not(:active)}');
                --GestureArea_deferredMagnetism: true;
                --GestureArea_dynamicEnvironment: true;
                --GestureArea_magnetAreas: url('#{x-draggable:not(:active)}');
                /* --GestureArea_magnetAreas: url('#{x-resizable:not(:active)}'); */
                --GestureArea_magnetism: 10;
                /* --GestureArea_receptive: true; */

                /* box-sizing: border-box; */
                /* background: #f002; */
                height: var(--size);
                /* height: fit-content; */
                left: calc(var(--index) * var(--size));
                max-height: 256px;
                max-width: 256px;
                /* margin: 5px; */
                min-height: 64px;
                min-width: 64px;
                position: absolute;
                top: calc(var(--index) * var(--size));
                width: var(--size);
                /* width: fit-content; */
            }

            x-repeater {
                --Component_autoRefresh: true;
            }

            x-resizable {
                --Component_eventsWithoutPropagation: swipeMain swipeStartMain swipeStopMain;
                /* --Component_eventsWithoutPropagation: pointerdown swipeMain; */
                /* --GestureArea_deferredMagnetism: true; */
                --GestureArea_dynamicEnvironment: true;
                --GestureArea_magnetAreas: url('#{x-draggable:not(:active)}');
                /* --GestureArea_magnetAreas: url('#{x-resizable:not(:active)}'); */
                /* --GestureArea_magnetAreas: url('#{x-resizable}'); */
                --GestureArea_magnetism: 10;
                /* --Resizable_keepProportions: true; */
                --Resizable_resettable: true;
                --Resizable_target: url('#{x-draggable}');


                background: #0f04;
                border: #000 solid 1px;


                &[_Draggable_dropAreaTarget] {
                    border: #0f0 solid 2px;
                }

                &[_resizing] {
                    background: #00f4;
                }

                [_dragging] & {
                    background: #f004;
                }

                [_GestureArea_magnetEdges] & {
                    background: #0ff4;
                }

                [_GestureArea_magnetEdges~='bottom'] & {
                    border-bottom: red solid 2px;
                }

                [_GestureArea_magnetEdges~='left'] & {
                    border-left: red solid 2px;
                }

                [_GestureArea_magnetEdges~='right'] & {
                    border-right: red solid 2px;
                }

                [_GestureArea_magnetEdges~='top'] & {
                    border-top: red solid 2px;
                }


                &::part(display) {
                    display: grid;
                    place-items: center;
                }
            }
        </style>

        <script type='module'>
            import * as generic from '/Packages/Generic/Generic.js';


            let Component = generic.frontend.components.Component;
            await Component._defined;
        </script>
    </head>

    <body>
        <x-repeater interpolationKey='repeater' model='1e2' target_='x-repeater'>
            <template Repeater_delegate>
                <!-- <x-draggable style='--index: {{repeater: index}};'> -->
                <!-- <x-draggable -->
                <!--     style=' -->
                <!--         left: {{repeater: Math.round(Math.random() * 2e3)}}px; -->
                <!--         top: {{repeater: Math.round(Math.random() * 1e3)}}px; -->
                <!--     ' -->
                <!-- > -->
                <x-draggable
                    style='
                        left: calc({{repeater: index % 10}} * var(--size));
                        top: calc({{repeater: index / 10 ^ 0}} * var(--size));
                    '
                >
                    <x-resizable>
                        {{repeater: data.value}}
                    </x-resizable>
                </x-draggable>
            </template>

            <!-- <template Repeater_model> -->
            <!--     <script> -->
            <!--         [1, 2, 3] -->
            <!--     </script> -->
            <!-- </template> -->
        </x-repeater>
    </body>
</html>
