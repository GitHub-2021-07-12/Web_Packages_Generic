<!DOCTYPE html>


<html>
    <head>
        <meta charset='utf-8' content='user-scalable=no, width=720' name='viewport'>
        <title>Test</title>

        <link href='/Packages/Generic/Frontend/Themes/Main/Main.css' rel='stylesheet'>

        <style>
            body {
                padding: 10px;
            }

            x-repeater {
                --Component_autoRefresh: true;
            }


            [_Repeater_excluded] {
                opacity: 0.2;
            }

            [Repeater_item] {
                border: #000 solid 1px;
                display: inline-block;
                margin: 10px;
                padding: 10px;
                width: max-content;
            }


            .delegate1 {
                background: #0f04;
            }

            .delegate2 {
                background: #00f4;
            }

            .delegate3 {
                background: #f004;
            }
        </style>

        <script type='module'>
            import * as generic from '/Packages/Generic/Generic.js';


            window.Repeater = generic.frontend.components.Repeater;
            await Repeater._defined;


            let repeaters = document.querySelectorAll('x-repeater');
            repeaters[0].ItemManager = class ItemManager extends Repeater.ItemManager {
                _init() {
                    this.applyData();
                    this.applyIndex();
                }


                applyData() {
                    console.log(this)

                    this._elements.value.textContent = this._modelItem.data.value;
                }

                applyIndex() {
                    this._elements.index.textContent = this._modelItem.index;
                }
            };
            // repeaters[0].model.filterRegExp = /1/;
            // // repeaters[0].refresh();
            // repeaters[1].ItemManager = repeaters[0].ItemManager;
            // repeaters[1].model = repeaters[0].model;

        </script>
    </head>

    <body>
        <x-repeater model='5'>
            <template>
                <div Repeater_item class='delegate1'>
                    <span Repeater_element='index'></span>: <span Repeater_element='value'></span>
                </div>
            </template>
        </x-repeater>

        <x-repeater interpolationKey='repeater2'><template>
            <div Repeater_item class='delegate2'>
                <div>{{repeater2: index}}: {{repeater2: data.value}}</div>
                <span Repeater_element='index'></span>: <span Repeater_element='value'></span>
            </div>

            <script Repeater_ItemManager>
                class ItemManager extends Repeater.ItemManager {
                    _init() {
                        this.applyData();
                        this.applyIndex();
                    }


                    applyData() {
                        this._elements.value.textContent = this._modelItem.data.value;
                    }

                    applyIndex() {
                        this._elements.index.textContent = this._modelItem.index;
                    }
                }
            </script>

            <script Repeater_model>
                [1, 2, 3]
            </script>
        </template></x-repeater>
    </body>
</html>
