<!DOCTYPE html>


<html>
    <head>
        <meta charset='utf-8' content='user-scalable=no, width=720' name='viewport'>
        <title>Test</title>

        <link href='/Packages/Generic/Frontend/Themes/Main/Main.css' rel='stylesheet'>

        <style>
            body {
                padding: 10px;
            }

            x-repeater {
                --Component_autoRefresh: true;
            }


            [_Repeater_item] {
                border: #000 solid 1px;
                display: inline-block;
                margin: 10px;
                padding: 10px;
                width: max-content;
            }


            .delegate1 {
                background: #0f04;
            }

            .delegate2 {
                background: #00f4;
            }
        </style>

        <script type='module'>
            import * as generic from '/Packages/Generic/Generic.js';


            window.Repeater = generic.frontend.components.Repeater;
            await Repeater._defined;


            let repeaters = document.querySelectorAll('x-repeater');
            repeaters[1].Manager = repeaters[0].Manager;
            // repeaters[1].delegate = repeaters[0].delegate;
            repeaters[1].model = repeaters[0].model;

        </script>
    </head>

    <body>
        <x-repeater interpolationKey='repeater1' model='5'>
            <template Repeater_delegate>
                <div class='delegate1'>
                    <span Repeater_element='index'></span> - <span Repeater_element='value'></span>
                </div>

                <div class='delegate2'>
                    <div>{{repeater2: index}} - {{repeater2: data.value}}</div>
                    <span Repeater_element='index'></span> - <span Repeater_element='value'></span>
                </div>


                <script>
                    class Manager extends Repeater.Manager {
                        static selectDelegate(modelItem) {
                            return modelItem.index % 2;
                        }


                        applyData() {
                            this._elements.value.textContent = this._modelItem.data.value;
                        }

                        applyIndex() {
                            this._elements.index.textContent = this._modelItem.index;
                        }

                        init() {
                            this.applyData();
                            this.applyIndex();
                        }
                    }
                </script>
            </template>
        </x-repeater>

        <x-repeater interpolationKey='repeater2' model='5'>
            <template Repeater_delegate>
                <div class='delegate2'>
                    <div>{{repeater2: index}} - {{repeater2: data.value}}</div>
                    <span Repeater_element='index'></span> - <span Repeater_element='value'></span>
                </div>
            </template>

            <!-- <script> -->

            <!-- </script> -->
        </x-repeater>
    </body>
</html>
